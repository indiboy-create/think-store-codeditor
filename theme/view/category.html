{include file="layout/head" /}
{include file="layout/header" /}

<section class="codeditor-page-head">
    <div class="codeditor-container codeditor-page-head__inner">
        <div>
            <div class="codeditor-breadcrumb">
                <a href="{$home}">项目介绍</a>
                <i class="layui-icon layui-icon-right"></i>
                <span>分类管理</span>
            </div>
            <h1 class="codeditor-page-title">模板分类管理</h1>
            <p class="codeditor-page-desc">维护模板分类，支持新增、编辑、删除与排序；操作人与站点由主项目 Session 统一写入。</p>
        </div>
        <div class="codeditor-page-head__actions">
            <span class="codeditor-badge"><i class="layui-icon layui-icon-list"></i> template_category</span>
            <a class="codeditor-btn codeditor-btn--outline codeditor-btn--sm" href="{$template}">
                <i class="layui-icon layui-icon-edit"></i> 返回模板编辑器
            </a>
        </div>
    </div>
</section>

<main class="codeditor-admin__body">
    <div class="codeditor-container">
        <div class="codeditor-admin__card">
            <div class="codeditor-admin__toolbar">
                <div class="codeditor-admin__search">
                    <i class="layui-icon layui-icon-search"></i>
                    <input type="text" id="category-search" class="layui-input" placeholder="按 ID、标题或名称筛选">
                </div>
                <div class="codeditor-admin__actions">
                    <button type="button" class="codeditor-btn codeditor-btn--outline codeditor-btn--sm" id="btn-category-refresh">
                        <i class="layui-icon layui-icon-refresh"></i> 刷新
                    </button>
                    <button type="button" class="codeditor-btn codeditor-btn--primary codeditor-btn--sm" id="btn-category-create">
                        <i class="layui-icon layui-icon-add-1"></i> 新增分类
                    </button>
                </div>
            </div>
            <table id="category-table" lay-filter="category-table"></table>
        </div>
    </div>
</main>

<script type="text/html" id="category-toolbar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a>
</script>

<script type="text/html" id="category-form-tpl">
    <div class="codeditor-category-form">
        <form class="layui-form" lay-filter="category-form">
            <input type="hidden" name="id">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">分类标题</label>
                    <div class="layui-input-inline">
                        <input type="text" name="title" class="layui-input" placeholder="例如：企业模板">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">分类名称</label>
                    <div class="layui-input-inline">
                        <input type="text" name="name" class="layui-input" placeholder="英文或标识名">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">分类图片</label>
                <div class="layui-input-block">
                    <input type="text" name="titlepic" class="layui-input" placeholder="图片地址，可选">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">分类介绍</label>
                <div class="layui-input-block">
                    <textarea name="intro" class="layui-textarea" placeholder="分类介绍，可选"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">排序</label>
                    <div class="layui-input-inline">
                        <input type="number" name="sort" class="layui-input" value="0" min="0">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline">
                        <select name="status">
                            <option value="1" selected>启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">最后一级</label>
                    <div class="layui-input-inline">
                        <select name="is_last">
                            <option value="0" selected>否</option>
                            <option value="1">是</option>
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
</script>

<script>
window.CODEDITOR_CATEGORY = {
    api: '{$base}',
    assets: '{$assets}',
    read: '{$categoryApi}/read',
    create: '{$categoryApi}/create',
    update: '{$categoryApi}/update',
    delete: '{$categoryApi}/delete'
};
</script>
{include file="layout/footer" /}
