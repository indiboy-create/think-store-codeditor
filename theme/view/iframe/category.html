<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{$title} · Think Store Codeditor</title>
<meta name="description" content="{$description}">
<link rel="stylesheet" href="{$assets}/layui/css/layui.css" media="all">
<link rel="stylesheet" href="{$assets}/iframe/css/iframe.css" media="all">
</head>
<body>

<div class="layui-card layadmin-header">
    <div class="layui-breadcrumb" lay-filter="breadcrumb">
        <a lay-href="{$home}" target="_top">主页</a>
        <a><cite>分类管理</cite></a>
        <a><cite>简易管理</cite></a>
    </div>
</div>

<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header">
                    模板分类
                    <span class="layui-badge layui-bg-blue" id="iframe-category-count">--</span>
                </div>
                <div class="layui-card-body">
                    <div class="iframe-toolbar">
                        <div class="layui-inline">
                            <input type="text" id="iframe-category-search" class="layui-input" placeholder="按 ID、标题或名称筛选">
                        </div>
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="iframe-category-expand" style="display: none;">展开全部</button>
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="iframe-category-refresh">刷新</button>
                        <button type="button" class="layui-btn layui-btn-sm" id="iframe-category-create">新增分类</button>
                    </div>
                    <table class="layui-hide" id="iframe-category-table" lay-filter="iframe-category-table"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="iframe-category-tools">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="delete">删除</a>
</script>

<script type="text/html" id="iframe-category-form">
    <div class="iframe-form">
        <form class="layui-form" lay-filter="iframe-category-form">
            <input type="hidden" name="id">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">分类标题</label>
                    <div class="layui-input-inline">
                        <input type="text" name="title" class="layui-input" placeholder="例如：企业模板">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">分类名称</label>
                    <div class="layui-input-inline">
                        <input type="text" name="name" class="layui-input" placeholder="英文或标识名">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">分类图片</label>
                <div class="layui-input-block">
                    <input type="text" name="titlepic" class="layui-input" placeholder="图片地址，可选">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">分类介绍</label>
                <div class="layui-input-block">
                    <textarea name="intro" class="layui-textarea" placeholder="分类介绍，可选"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">排序</label>
                    <div class="layui-input-inline">
                        <input type="number" name="sort" class="layui-input" value="0" min="0">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline">
                        <select name="status">
                            <option value="1" selected>启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">最后一级</label>
                    <div class="layui-input-inline">
                        <select name="is_last">
                            <option value="0" selected>否</option>
                            <option value="1">是</option>
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
</script>

<script>
window.CODEDITOR_IFRAME_CATEGORY = {
    api: '{$base}',
    read: '{$categoryApi}/read',
    create: '{$categoryApi}/create',
    update: '{$categoryApi}/update',
    delete: '{$categoryApi}/delete'
};
</script>
<script src="{$assets}/layui/layui.js"></script>
<script src="{$assets}/iframe/js/category.js"></script>
</body>
</html>
