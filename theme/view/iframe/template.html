<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{$title} · Think Store Codeditor</title>
<meta name="description" content="{$description}">
<link rel="stylesheet" href="{$assets}/layui/css/layui.css" media="all">
<link rel="stylesheet" href="{$assets}/iframe/css/iframe.css" media="all">
</head>
<body>

<div class="layui-card layadmin-header">
    <div class="layui-breadcrumb" lay-filter="breadcrumb">
        <a lay-href="{$home}" target="_top">主页</a>
        <a><cite>模板编辑</cite></a>
        <a><cite>简易管理</cite></a>
    </div>
</div>

<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header">
                    模板列表
                    <span class="layui-badge layui-bg-blue" id="iframe-template-count">--</span>
                </div>
                <div class="layui-card-body">
                    <div class="iframe-toolbar">
                        <div class="layui-inline">
                            <input type="text" id="iframe-template-search" class="layui-input" placeholder="按 ID 或标题筛选">
                        </div>
                        <div class="layui-inline">
                            <select id="iframe-template-cid" class="iframe-select" lay-ignore>
                                <option value="">全部分类</option>
                            </select>
                        </div>
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="iframe-template-refresh">刷新</button>
                        <button type="button" class="layui-btn layui-btn-sm" id="iframe-template-create">新增模板</button>
                    </div>
                    <table class="layui-hide" id="iframe-template-table" lay-filter="iframe-template-table"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="iframe-template-tools">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="view">查看</a>
</script>

<script type="text/html" id="iframe-template-form">
    <div class="iframe-form">
        <form class="layui-form" lay-filter="iframe-template-form">
            <input type="hidden" name="id">
            <div class="layui-form-item" data-role="meta">
                <div class="layui-inline">
                    <label class="layui-form-label">模板标题</label>
                    <div class="layui-input-inline">
                        <input type="text" name="title" class="layui-input" readonly placeholder="由主项目维护">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">所属分类</label>
                    <div class="layui-input-inline">
                        <input type="text" name="cid_text" class="layui-input" readonly placeholder="由主项目维护">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">模板内容</label>
                <div class="layui-input-block">
                    <textarea name="content" class="layui-textarea iframe-content" placeholder="HTML 与 PHP 混合模板内容"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">修改说明</label>
                <div class="layui-input-block">
                    <input type="text" name="intro" class="layui-input" placeholder="可选，例如：调整首页结构">
                </div>
            </div>
            <div class="layui-form-item" data-role="file">
                <label class="layui-form-label">模板文件</label>
                <div class="layui-input-block">
                    <input type="text" name="file" class="layui-input" placeholder="可选，例如 default/index.html">
                    <div class="iframe-tip">
                        相对可编辑目录的路径，留空只写入数据库；受 file.root、file.allow_dirs 与 file.ext 限制。
                    </div>
                </div>
            </div>
        </form>
    </div>
</script>

<script>
window.CODEDITOR_IFRAME_TEMPLATE = {
    api: '{$base}',
    read: '{$templateApi}/read',
    create: '{$templateApi}/create',
    update: '{$templateApi}/update',
    category: '{$categoryApi}/read',
    assets: '{$assets}'
};
</script>
<script src="{$assets}/layui/layui.js"></script>
<script src="{$assets}/iframe/js/template.js"></script>
</body>
</html>
